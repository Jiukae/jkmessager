<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Iced Americano Reel</title>
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-kr/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-kr/900.css">
<script type="importmap">
{
	"imports": {
		"three": "/node_modules/three/build/three.module.js",
		"three/addons/": "/node_modules/three/examples/jsm/",
		"cannon-es": "/node_modules/cannon-es/dist/cannon-es.js"
	}
}
</script>
<style>
	html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
	#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans KR', 'Noto Color Emoji', sans-serif; }
	#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
	#ui { position: absolute; inset: 0; pointer-events: none; color: #fff; }
	.shadow { text-shadow: 0 4px 18px rgba(0,0,0,0.45), 0 2px 4px rgba(0,0,0,0.35); }

	#hook { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
	#hook .kicker { display: inline-block; font-weight: 700; font-size: 44px; padding: 10px 30px; border-radius: 999px;
		background: rgba(255,255,255,0.92); color: #3a2414; letter-spacing: -0.5px; }
	#hook .big { margin-top: 26px; font-weight: 900; font-size: 128px; line-height: 1.04; letter-spacing: -4px; }
	#hook .big em { font-style: normal; color: #ffd36e; }
	#hook .sub { margin-top: 22px; font-weight: 700; font-size: 46px; }

	#step { position: absolute; left: 72px; top: 270px; }
	#step .no { display: inline-block; font-weight: 900; font-size: 36px; letter-spacing: 2px; padding: 8px 22px; border-radius: 14px;
		background: #ffd36e; color: #2b1a0e; }
	#step .title { margin-top: 14px; font-weight: 900; font-size: 92px; letter-spacing: -3px; line-height: 1.05; }

	#progress { position: absolute; left: 72px; right: 72px; top: 220px; display: flex; gap: 12px; }
	#progress i { flex: 1; height: 9px; border-radius: 9px; background: rgba(255,255,255,0.35); overflow: hidden; position: relative; }
	#progress i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; border-radius: 9px; }

	#tag { position: absolute; left: 72px; top: 560px; font-weight: 900; font-size: 50px; padding: 14px 30px; border-radius: 20px;
		background: rgba(20,12,6,0.62); backdrop-filter: blur(6px); color: #fff; white-space: nowrap; }

	#sub { position: absolute; left: 70px; right: 70px; top: 1250px; text-align: center; font-weight: 900; font-size: 60px; line-height: 1.32;
		letter-spacing: -1.5px; word-break: keep-all; }
	#sub span { display: inline; padding: 0 2px; color: rgba(255,255,255,0.97); -webkit-text-stroke: 2px rgba(0,0,0,0.25); paint-order: stroke fill; }
	#sub span.on { color: #ffd36e; }

	#outro { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
	#outro .big { font-weight: 900; font-size: 140px; letter-spacing: -4px; }
	#outro .save { margin-top: 26px; display: inline-block; font-weight: 900; font-size: 50px; padding: 16px 36px; border-radius: 999px;
		background: #ffd36e; color: #2b1a0e; }
	#outro .tags { margin-top: 28px; font-weight: 700; font-size: 38px; opacity: 0.95; }
</style>
</head>
<body>
<div id="stage">
	<canvas id="gl" width="1080" height="1920"></canvas>
	<div id="ui">
		<div id="progress"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
		<div id="hook" class="shadow">
			<div class="kicker">☕ 1분 홈카페 레시피</div>
			<div class="big">아이스<br><em>아메리카노</em></div>
			<div class="sub">카페 맛 그대로, 딱 5단계</div>
		</div>
		<div id="step" class="shadow"><div class="no">STEP 1</div><div class="title"></div></div>
		<div id="tag"></div>
		<div id="sub" class="shadow"></div>
		<div id="outro" class="shadow">
			<div class="big">완성! ✨</div>
			<div class="save">📌 저장하고 따라 해보세요</div>
			<div class="tags">#홈카페 #아이스아메리카노 #아아</div>
		</div>
	</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
